[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shockflow-ai"
version = "0.1.0"  # v0 milestone (Phases 00-08); see VERSION
description = "Event-aware urban mobility demand forecasting and fleet rebalancing decision-support system."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "tzdata>=2024.1",  # IANA tz database for zoneinfo on Windows
    "h3>=4.0",  # H3 hexagonal grid for zone assignment (CLAUDE.md section 4)
    "pyyaml>=6.0",  # versioned cost/elasticity assumption sets (config/*.yaml; optimization/ledger_run)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "scipy>=1.11",  # statistical hypothesis tests for EDA verification
    "aiohttp>=3.9",  # closed-loop load-test client (scripts/load_test_api, scripts/free_tier_probe)
    "pytest-socket>=0.7",  # tests never reach the public network (see [tool.pytest.ini_options])
    "pytest-timeout>=2.3",  # a hung test fails in 120 s instead of eating the 30 min CI budget
    "pytest-cov>=6.0",  # coverage measurement + floor in CI (see [tool.coverage])
    "pre-commit>=4.0",  # local ruff hooks so format/lint failures never reach CI (`pre-commit install`)
]
graph = [
    "neo4j>=5.0",  # optional live graph backend (Demo Mode runs offline without it)
]
rdb = [
    "sqlalchemy>=2.0",  # optional relational store (SQLite default; Postgres via DATABASE_URL)
]
ml = [
    "scikit-learn>=1.4",  # forecasting model zoo, GridSearch, feature selection (Phase 06)
    "pandas>=2.1",  # tabular panel assembly for the supervised design matrix
    "matplotlib>=3.8",  # interpretation figures (feature importance, ablation)
]
api = [
    "fastapi>=0.110",  # replay/forecast/explanation API (Phase 07, section 12)
    "uvicorn>=0.29",  # ASGI server for `make api`
    "httpx>=0.27",  # TestClient transport for API integration tests
]
recsys = [
    "torch>=2.2,<2.9",  # V1-07B/C dual-encoder retriever + cross-attention reranker (CPU wheel)
]
vectorstore = [
    "faiss-cpu>=1.8",  # persistent ANN index: recsys FaissIndex + accumulating news vector store
]
llm = [
    "openai>=1.30",  # opt-in real GPT-4o event extraction (LLM_PROVIDER=openai)
    "anthropic>=0.34",  # opt-in real Claude event extraction (LLM_PROVIDER=anthropic)
]
mcp = [
    "mcp>=2.2",  # operator copilot tools as an MCP server (services/mcp) + stdio client
]
ragas = [
    # Optional: real RAGAS non-LLM retrieval metrics for the V2-06 copilot benchmark
    # (ml/copilot/ragas_retrieval.py). Absent -> that runner records blocked_external, no fake numbers.
    "ragas>=0.4",
    "rapidfuzz>=3.0",  # string-distance backend ragas uses for NonLLM context precision/recall
]

[tool.setuptools]
# Explicit package list; keeps the scaffold importable under pip -e install.
packages = [
    "contracts",
    "contracts.v1",
    "contracts.v2",
    "config",
    "ml.recsys",
    "services",
    "services.api",
    "services.mcp",
    "pipelines",
    "pipelines.collectors",
    "pipelines.events",
    "pipelines.features",
    "pipelines.graph",
    "pipelines.live",
    "ml",
    "ml.forecasting",
    "ml.pricing",
    "ml.experiment",
    "ml.vectorstore",
    "ml.anomaly",
    "ml.search",
    "optimization",
    "optimization.classical",
    "optimization.quantum",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is enforced by `ruff format`; E501 would only re-flag long strings/comments it
# cannot wrap, so the check gate stays meaningful instead of permanently red.
ignore = ["E501"]

[tool.mypy]
# Matches the interpreter used for development (see docs/STATUS.md); numpy's 3.12 stubs
# require this target to parse.
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false  # tighten per-module as contracts land

[[tool.mypy.overrides]]
module = ["h3", "numpy.*", "scipy.*", "neo4j", "anthropic", "openai", "sklearn.*", "pandas.*", "matplotlib.*", "joblib.*", "qiskit.*", "qiskit_aer.*", "qiskit_optimization.*", "qiskit_algorithms.*"]
ignore_missing_imports = true  # third-party libs without usable stubs for our purposes
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests must not depend on the runner's egress (CLAUDE.md section 17; GitHub runners have
# internet, the dev sandbox does not). pytest-socket refuses every TCP connection except
# loopback (TestClient, the "cluster unreachable" degrade tests) and Unix sockets (asyncio's
# self-pipe, the MCP stdio client's subprocess plumbing).
addopts = "--disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket --timeout=120"
# Warnings policy: every warning is an error unless it is listed here with a reason. A new
# warning therefore fails the suite at the change that introduced it, instead of accumulating.
filterwarnings = [
    "error",
    # The promoted serving model is a pickle; sklearn warns (does not fail) when a different
    # version unpickles it. That is a silent reproducibility drift, so the harness treats it as
    # an error (the loader in ml/forecasting/promoted.py refuses the mismatch at runtime too).
    "error::sklearn.exceptions.InconsistentVersionWarning",
    # starlette's TestClient still references an anyio alias; upstream, not ours.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # pytest-socket also emits a UserWarning when it blocks a connect; the guard test expects it.
    "ignore:A test tried to use socket.socket.connect:UserWarning",
    # tests/unit/test_recsys.py::test_mlp_scorer_smoke fits a tiny MLP with max_iter=300 on
    # purpose (speed); the optimiser reporting non-convergence is expected there.
    "ignore:Stochastic Optimizer.*Maximum iterations:sklearn.exceptions.ConvergenceWarning",
]

[tool.coverage.run]
# What counts: the product and pipeline code. Tests, the web app, generated and vendored trees
# are excluded so the number describes the code under test, not the tests themselves.
source = ["."]
omit = ["tests/*", "apps/*", ".venv/*", "*/node_modules/*", "scripts/free_tier_probe.py", "scripts/load_test_api.py", "scripts/spark_shuffle_bench.py"]
branch = false

[tool.coverage.report]
skip_empty = true
precision = 1
