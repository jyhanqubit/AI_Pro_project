name: harness

# The verification harness on every push and pull request: lint + format gate, the offline test
# suite (optional extras such as torch/faiss skip, never fail), and the two V2 audit gates that
# check every committed artifact's provenance envelope, completion set and traceability.
# Type checking runs but does not block yet (known debt is tracked in README > 검증 하네스).

on:
  push:
    branches: [master, v2, dev]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      # Exact versions from the lock (requirements/dev.txt, generated by `make lock`), then the
      # project itself without re-resolving. The lock pins scikit-learn to the version the promoted
      # model was pickled with; the loader refuses any other, so CI and Render must not float.
      - name: Install from the lock
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Lint and format gate
        run: |
          ruff check .
          ruff format --check .
      - name: Build the event graph snapshot (offline, ~1 s; three copilot tests need it)
        run: make seed-graph
      - name: Tests (offline; optional extras skip)
        env:
          OMP_NUM_THREADS: "1"
        run: python -m pytest -q
      - name: V2 audit gates (envelope, completion, traceability)
        run: |
          python -m scripts.v2_audit
          python -m scripts.v2_final_audit
      # The gates regenerate committed artifacts (claim_matrix.json, the graph snapshot). If the
      # regenerated copy differs from what is committed, someone changed inputs without
      # re-running the harness — fail here instead of letting the tree drift.
      - name: Generated artifacts match the committed tree
        run: git diff --exit-code --stat
      - name: Type check (advisory)
        continue-on-error: true
        run: python -m mypy .
