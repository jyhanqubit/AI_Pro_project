# Local databases for ShockFlow AI. Both are OPTIONAL — Demo Mode and the golden-path pipeline run
# fully offline without them (in-memory graph + SQLite / JSON fixtures). Bring these up only when you
# want a live Neo4j graph or a Postgres relational store.
#
#   docker compose up -d neo4j        # graph:  bolt://localhost:7687, browser http://localhost:7474
#   docker compose up -d postgres     # rdb:    postgresql+psycopg://shockflow:shockflow@localhost:5432/shockflow
#
# Then, for the graph:
#   pip install -e '.[graph]'
#   export NEO4J_URI=bolt://localhost:7687 NEO4J_USER=neo4j NEO4J_PASSWORD=shockflow_dev
#   make graph-upsert-neo4j
#
# For Postgres (SQLite is the zero-config default; Postgres is opt-in):
#   pip install -e '.[rdb]' 'psycopg[binary]'
#   export DATABASE_URL='postgresql+psycopg://shockflow:shockflow@localhost:5432/shockflow'
#   make db-load
#
# Credentials here are LOCAL DEV ONLY — override via the environment for anything real.

services:
  neo4j:
    image: neo4j:5
    container_name: shockflow-neo4j
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-shockflow_dev}"
      NEO4J_server_memory_pagecache_size: "256M"
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16
    container_name: shockflow-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-shockflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-shockflow}"
      POSTGRES_DB: "${POSTGRES_DB:-shockflow}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shockflow}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
  postgres_data:
